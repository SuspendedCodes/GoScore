name: Test and build GoScore for Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q goscore run.py desktop_launcher.py
      - name: Run regression test modules separately
        shell: bash
        run: |
          python -m unittest tests.test_engine tests.test_football tests.test_multiday tests.test_super_over_ui_regression tests.test_overlay_feature_smoke -v
          python -m unittest tests.test_api -v
          python -m unittest tests.test_football_api -v
          python -m unittest tests.test_multiday_api -v

  build-windows:
    name: Build Windows GUI executable
    needs: tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build GUI executable
        run: python -m PyInstaller --clean --noconfirm GoScore.spec
      - name: Upload EXE build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoScore-Windows-x64
          path: dist/GoScore.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release asset for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoScore.exe
          generate_release_notes: true
